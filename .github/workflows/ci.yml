name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Brine composite-builds against ../SmokeHouse → ../SuperBeefSort → ../CSRBT,
      # so all four repos are checked out as siblings and Gradle runs from Brine.
      - name: Check out Brine
        uses: actions/checkout@v4
        with:
          path: Brine

      # The sibling repositories are private, and the token a workflow is given can read
      # only its own repository. This step gets a short-lived, read-only token for exactly
      # the siblings checked out below, from the "RicheyWorks Java Composite CI" GitHub App
      # (its private key is the repository secret COMPOSITE_CI_PRIVATE_KEY).
      - name: Token for the private sibling repositories
        id: siblings
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23lizKGwyp1EXRPJlY
          private-key: ${{ secrets.COMPOSITE_CI_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: SmokeHouse,SuperBeefSort,CSRBT
          permission-contents: read

      - name: Check out SmokeHouse (sibling, for the composite build)
        uses: actions/checkout@v4
        with:
          repository: RicheyWorks/SmokeHouse
          token: ${{ steps.siblings.outputs.token }}
          path: SmokeHouse

      - name: Check out SuperBeefSort (sibling, nested composite)
        uses: actions/checkout@v4
        with:
          repository: RicheyWorks/SuperBeefSort
          token: ${{ steps.siblings.outputs.token }}
          path: SuperBeefSort

      - name: Check out CSRBT (sibling, nested composite)
        uses: actions/checkout@v4
        with:
          repository: RicheyWorks/CSRBT
          token: ${{ steps.siblings.outputs.token }}
          path: CSRBT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test
        working-directory: Brine
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
