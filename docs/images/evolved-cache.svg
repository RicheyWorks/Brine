<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="918" viewBox="0 0 1200 918" font-family="Helvetica, Arial, sans-serif"><rect width="1200" height="918" fill="#f6f5f1"/><text x="60" y="70" font-size="34" font-weight="700" fill="#111">Brine</text><text x="60" y="104" font-size="18" fill="#555">A read-through cache whose eviction policy is evolved, not chosen</text><rect x="60" y="150" width="1080" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="600" y="186" text-anchor="middle" font-size="22" font-weight="700">brine.get(id)</text><text x="600" y="214" text-anchor="middle" font-size="15" fill="#555">caller&#x27;s thread</text><line x1="600.0" y1="244" x2="600.0" y2="282" stroke="#111" stroke-width="2"/><path d="M593.0,276 L600.0,286 L607.0,276" fill="none" stroke="#111" stroke-width="2"/><rect x="60" y="292" width="528" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="324" y="328" text-anchor="middle" font-size="22" font-weight="700">Champion holds it?</text><text x="324" y="356" text-anchor="middle" font-size="15" fill="#555">memory hit</text><rect x="612" y="292" width="528" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="876" y="328" text-anchor="middle" font-size="22" font-weight="700">Not resident</text><text x="876" y="356" text-anchor="middle" font-size="15" fill="#555">read SmokeHouse, keep value</text><line x1="600.0" y1="386" x2="600.0" y2="424" stroke="#111" stroke-width="2"/><path d="M593.0,418 L600.0,428 L607.0,418" fill="none" stroke="#111" stroke-width="2"/><rect x="60" y="434" width="1080" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="600" y="470" text-anchor="middle" font-size="22" font-weight="700">Evolution loop (CSRBT experimental)</text><text x="600" y="498" text-anchor="middle" font-size="15" fill="#555">every windowOps lookups</text><line x1="600.0" y1="528" x2="600.0" y2="566" stroke="#111" stroke-width="2"/><path d="M593.0,560 L600.0,570 L607.0,560" fill="none" stroke="#111" stroke-width="2"/><rect x="60" y="576" width="252" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="186" y="612" text-anchor="middle" font-size="22" font-weight="700">Founders</text><text x="186" y="640" text-anchor="middle" font-size="15" fill="#555">seed genomes</text><rect x="336" y="576" width="252" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="462" y="612" text-anchor="middle" font-size="22" font-weight="700">Shadow trials</text><text x="462" y="640" text-anchor="middle" font-size="15" fill="#555">mirror live traffic</text><rect x="612" y="576" width="252" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="738" y="612" text-anchor="middle" font-size="22" font-weight="700">Viability gate</text><text x="738" y="640" text-anchor="middle" font-size="15" fill="#555">drop the unfit</text><rect x="888" y="576" width="252" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="1014" y="612" text-anchor="middle" font-size="22" font-weight="700">(mu+lambda) selection</text><text x="1014" y="640" text-anchor="middle" font-size="15" fill="#555">gated promotion</text><line x1="600.0" y1="670" x2="600.0" y2="708" stroke="#111" stroke-width="2"/><path d="M593.0,702 L600.0,712 L607.0,702" fill="none" stroke="#111" stroke-width="2"/><rect x="60" y="718" width="1080" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="600" y="754" text-anchor="middle" font-size="22" font-weight="700">SmokeHouse tail</text><text x="600" y="782" text-anchor="middle" font-size="15" fill="#555">every commit invalidates; a gap clears the cache</text><text x="60" y="864" font-size="15" fill="#555">Source: README.md. Same seed + same traffic =&gt; same champion lineage (tested).</text></svg>